name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check src tests tools

  mutations:
    # A green suite says the code does something. It does not say the tests would object if
    # the code did the wrong thing instead. This breaks the code on purpose, 71 ways, and
    # requires each one to turn the suite red -- see tools/mutate.py.
    #
    # Runs on every pull request rather than only when src/coldwatch/match/ changes: the
    # sweep also catches a *test* being weakened, and that can happen in a pull request that
    # touches no source file at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - name: Break the code on purpose and require the tests to notice
        run: python tools/mutate.py

  fixtures:
    # The fixtures must stay reproducible from their seed. If regenerating changes a byte,
    # something captured real data -- which CONTRIBUTING.md 4 forbids.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate fixtures and require them unchanged
        run: |
          python tools/make_fixtures.py
          git diff --exit-code tests/fixtures/
