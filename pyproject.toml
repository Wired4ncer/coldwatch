[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldwatch"
version = "0.0.0"
description = "A tripwire for cold storage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # The ZMQ client for bitcoind's publisher. See SECURITY.md's dependency table.
    "pyzmq>=25",
    # secp256k1 ECDH + BIP340 Schnorr for the Nostr channel's NIP-44 encryption (issue #3) --
    # the one piece of elliptic-curve arithmetic this project doesn't hand-roll.
    "coincurve>=20",
    # WebSocket client for publishing gift-wrapped events to Nostr relays.
    "websocket-client>=1.7",
]

[project.urls]
Homepage = "https://github.com/Wired4ncer/coldwatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coldwatch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
