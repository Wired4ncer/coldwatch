[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldwatch"
version = "0.0.0"
description = "A tripwire for cold storage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Wired4ncer/coldwatch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coldwatch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
